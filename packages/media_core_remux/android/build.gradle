group 'com.mediacore.remux'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.mediacore.remux'

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // MediaExtractor.setDataSource(Context, Uri, headers) is API 21, which
        // is where the whole stack this plugin uses begins. No newer API is
        // required, so the remuxer stays available across the app's floor.
        minSdkVersion 21
    }
}
