name: media_core_remux

description: Remux services for media_core - folds a CompositeMediaSource's separated video and audio essences into one playable MP4 with an FFmpeg stream copy, so single-URL backends can play DASH pairs.

publish_to: none

version: 0.1.0

resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # The vocabulary this service works in: MediaSource, CompositeMediaSource,
  # MediaRemuxer, and the MediaTimeline that aligns the essences before muxing.
  media_core:
    path: ../media_core

  # The one muxing stack, on every platform this package runs on. Same pin as
  # media_core_recording_ffmpeg so the workspace resolves a single binary
  # instead of shipping two FFmpegs.
  ffmpeg_kit_extended_flutter: 0.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
