name: media_core_audio
description: Music playback for media_core - sources, queue and play modes, lyrics and the native desktop-lyric windows, plus resumable downloads with tag/lyric writing.
version: 0.1.0
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  audio_service: ^0.18.19

  # Linux implementation of audio_service (MPRIS / D-Bus)
  audio_service_mpris: ^1.0.0-beta.3

  # Windows implementation of audio_service
  audio_service_win: 
    git:
      url: https://github.com/Predidit/audio_service_win.git
      ref: 8ad650c6eb487208b9861d44755c8e58db061c88

  # Audio focus / interruption / becoming-noisy events
  audio_session: ^0.2.3

  # Music downloads (HLS/adaptive sources, tag writing, codec choice).
  # Pinned to the version the app resolves, so a single native ffmpeg build
  # serves both packages.
  ffmpeg_kit_extended_flutter: ^0.6.2

  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Resumable HTTP transfers with tail verification, plus the transfer/file
  # abstractions the music download queue drives. Kept in its own package so
  # video/recording hosts can reuse the same transport.
  media_core_download:
    path: ../media_core_download

  # Background audio + media notification (lock screen / notification controls)
  # The media surfaces (notification / lock screen / SMTC / MPRIS) and audio
  # focus live in their own capability package now; this module uses them for
  # music instead of owning a second implementation.
  media_core_mediasession:
    path: ../media_core_mediasession

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Native desktop-lyric overlay (Windows layered window / Android overlay
# window). Declaring the platforms is what makes Flutter register the plugin
# and build the native side; the Dart API stays usable everywhere - a platform
# without the implementation reports "unsupported" through the transport.
flutter:
  plugin:
    platforms:
      android:
        package: com.mediacore.audio
        pluginClass: MediaCoreAudioPlugin
      windows:
        pluginClass: MediaCoreAudioPluginCApi
      macos:
        pluginClass: MediaCoreAudioPlugin
      linux:
        pluginClass: MediaCoreAudioPlugin

ffmpeg_kit_extended_config:
  type: "base" # pre-bundled builds: debug, base, full, audio, video, video_hw
  gpl: true # enable to include GPL libraries. WARNING: Make sure you understand what GPL license means before enabling. Check https://www.ffmpeg.org/legal.html for more information.
  small: true # enable to use smaller builds
