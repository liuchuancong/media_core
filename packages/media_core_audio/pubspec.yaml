name: media_core_audio
description: Background audio and audio session capability for media_core (audio_service / audio_session / audio_service_win).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Background audio + media notification (lock screen / notification controls)
  audio_service: ^0.18.19

  # Windows implementation of audio_service
  audio_service_win: ^0.0.3

  # Linux implementation of audio_service (MPRIS / D-Bus)
  audio_service_mpris: ^0.2.1

  # Audio focus / interruption / becoming-noisy events
  audio_session: ^0.2.3

  # Music downloads (HLS/adaptive sources, tag writing, codec choice).
  # Pinned to the version the app resolves, so a single native ffmpeg build
  # serves both packages.
  ffmpeg_kit_extended_flutter: 0.6.2

dev_dependencies:
  flutter_lints: ^6.0.0

# Native desktop-lyric overlay (Windows layered window / Android overlay
# window). Declaring the platforms is what makes Flutter register the plugin
# and build the native side; the Dart API stays usable everywhere - a platform
# without the implementation reports "unsupported" through the transport.
flutter:
  plugin:
    platforms:
      android:
        package: com.mediacore.audio
        pluginClass: MediaCoreAudioPlugin
      windows:
        pluginClass: MediaCoreAudioPluginCApi
