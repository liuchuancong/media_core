name: media_core_media_activity_example
description: >-
  Demonstrates integrating media_core_media_activity with an iOS Widget
  Extension: a simulated playback session drives the coordinator, the lock
  screen renders the Live Activity, and remote commands route back.
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # The plugin under demonstration.
  media_core_media_activity:
    path: ..

dev_dependencies:
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
