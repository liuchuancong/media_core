name: media_kit_video
resolution: workspace
description: Native implementation for video playback in package:media_kit.
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit
version: 1.2.5
publish_to: none
topics:
  - video
  - video-player
  - audio
  - audio-player
  - cross-platform

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  media_kit:
    path: ../media_kit

  synchronized: ^3.1.0
  wakelock_plus: 1.3.3
  wakelock_plus_ohos: ^0.0.3
  universal_platform: ^1.0.0+1
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  # Aligned with the rest of this workspace (all other members pin ^6.0.0);
# a workspace resolves one dev-dependency set, so the copied ^5.0.0 could
# not coexist with them. No package code was touched.
  flutter_lints: ^6.0.0



flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MediaKitVideoPluginCApi
      linux:
        pluginClass: MediaKitVideoPlugin
      macos:
        pluginClass: MediaKitVideoPlugin
      ios:
        pluginClass: MediaKitVideoPlugin
      android:
        package: com.alexmercerind.media_kit_video
        pluginClass: MediaKitVideoPlugin
      ohos:
        package: com.alexmercerind.media_kit_video
        pluginClass: MediaKitVideoPlugin
      web:
