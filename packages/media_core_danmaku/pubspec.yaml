name: media_core_danmaku
description: Danmaku sessions for media_core - platform-agnostic transport contract, message normalization, deduplication and filtering.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Session state and failure streams
  rxdart: ^0.28.0

  # Immutable session snapshot
  equatable: ^2.1.0

  # Similarity scoring for the fuzzy duplicate filter
  fuzzywuzzy: ^1.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
