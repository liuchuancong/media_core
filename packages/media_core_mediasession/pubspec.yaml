name: media_core_mediasession

description: System media surfaces for media_core - media notification, lock screen, SMTC and MPRIS for any player, video or audio.


version: 0.1.0
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues

resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  # The platform media surfaces. audio_service is the one abstraction that
  # reaches all four: a notification on Android, the lock screen and Control
  # Center on iOS, SMTC on Windows and MPRIS on Linux.
  audio_service: ^0.18.19

  # Linux implementation of audio_service (MPRIS / D-Bus).
  audio_service_mpris: ^1.0.0-beta.3

  # Windows implementation of audio_service (SMTC).
  audio_service_win: 
    git:
      url: https://github.com/Predidit/audio_service_win.git
      ref: 8ad650c6eb487208b9861d44755c8e58db061c88

  # Audio focus, interruptions and becoming-noisy.
  audio_session: ^0.2.3

  flutter:
    sdk: flutter

  # The player whose state is published and whose transport is driven.
  media_core:
    path: ../media_core

  meta: any
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
