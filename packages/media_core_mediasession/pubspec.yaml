name: media_core_mediasession

description: System media surfaces for media_core - media notification, lock screen, SMTC and MPRIS for any player, video or audio.


version: 0.1.0
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues

resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # The platform media surfaces and audio focus: Media3 on Android, Now
  # Playing on iOS/macOS, SMTC on Windows, the Media Session API on the web.
  flutter_media_session: ^3.1.0-pre.4


  # The player whose state is published and whose transport is driven.
  media_core:
    path: ../media_core

  meta: any
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
