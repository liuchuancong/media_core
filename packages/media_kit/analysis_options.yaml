# This file configures the static analysis results for this project.
#
# The package is vendored: its Dart and native sources are kept identical to
# Predidit/media-kit@d13fc22 plus the PureLive patch (see the repository's
# packages/media_kit_video/PURELIVE_PATCH.md), so the entries below only
# configure *analysis*; they never change what the code does.

include: package:lints/recommended.yaml

analyzer:
  # Web-only sources. They are written against dart:html and the legacy
  # package:js interop, and package:js 0.7.2 re-exports the internal
  # dart:_js_annotations library, which an analyzer can only resolve while a
  # JS platform is enabled. This package declares Android as its plugin
  # platform, so these files take part in no build here - and a consumer
  # targeting web still compiles them with the web compiler, which does
  # provide those libraries.
  exclude:
    - lib/src/player/web/**
    - lib/src/models/media/media_web.dart

  errors:
    # Upstream documentation style: library-level doc comments without a
    # `library;` directive, and `<...>` in prose. Style-only diagnostics,
    # silenced to keep the vendored diff against upstream at zero.
    dangling_library_doc_comments: ignore
    unintended_html_in_doc_comment: ignore
