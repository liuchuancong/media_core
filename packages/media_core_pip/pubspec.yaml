name: media_core_pip
description: Picture-in-picture for media_core - a desktop always-on-top small window and the Android system PiP window.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Desktop small window (Windows, macOS, Linux)
  window_manager: ^0.5.1

  # Android system picture-in-picture
  floating: ^6.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
