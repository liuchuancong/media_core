name: media_core_fvp
description: fvp (libmdk) backend adapter for the media_core player framework.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Published package. Note that pure_live vendors a stripped copy (android/ios
  # plugin platforms only) to keep libmdk off desktop; that copy is not used
  # here, so desktop builds resolve the published plugin and its native
  # dependency themselves.
  fvp: ^0.38.1

dev_dependencies:
  flutter_lints: ^6.0.0
