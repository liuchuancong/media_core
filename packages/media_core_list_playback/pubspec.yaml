name: media_core_list_playback
description: List playback for media_core - an ordered list played in one window, swiping up and down between items and resuming each item where it was left.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

dev_dependencies:
  flutter_lints: ^6.0.0
