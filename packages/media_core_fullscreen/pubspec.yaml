name: media_core_fullscreen
description: Fullscreen for media_core - the platform fullscreen state on desktop and the window-level fullscreen mode, with per-orientation fit strategies.
version: 0.1.0
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Direct user32 window-state calls (Win32FullscreenWindow)
  media_core_win32:
    path: ../media_core_win32

  # Desktop window fullscreen
  window_manager:
    git:
      url: https://github.com/leanflutter/window_manager.git
      ref: main

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
