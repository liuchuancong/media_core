name: media_core_mpv_audio
description: >-
  mpv_audio_kit backend adapter for media_core: the shared PlayerAdapter
  contract on the patched-libmpv audio engine, with its PCM/FFT taps,
  typed effects chain and media session carried through.
version: 0.1.0
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  media_core:
    path: ../media_core

  # The engine this adapter drives.
  mpv_audio_kit: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^11.0.0
