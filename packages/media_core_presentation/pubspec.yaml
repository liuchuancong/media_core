name: media_core_presentation
description: Presentation capability for media_core (fullscreen / PiP / floating window with video-orientation awareness).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Desktop fullscreen / always-on-top floating window (Windows, macOS, Linux)
  window_manager: ^0.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
