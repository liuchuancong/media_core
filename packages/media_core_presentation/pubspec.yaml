name: media_core_presentation
description: Presentation capability for media_core (fullscreen / PiP / floating window with video-orientation awareness).
version: 0.1.0
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.13.2 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Desktop fullscreen / always-on-top floating window (Windows, macOS, Linux)
  window_frame_kit: ^0.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
