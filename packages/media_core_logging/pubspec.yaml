name: media_core_logging
description: Levelled, categorised logging for media_core - one logger, per-module levels, pluggable sinks (console, memory, rotating file) and scoped fields.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # Log level and category value objects
  equatable: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
