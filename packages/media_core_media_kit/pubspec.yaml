name: media_core_media_kit
description: media_kit backend adapter for the media_core player framework.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # 本仓库自带的副本(含 PureLive 补丁, 见 media_kit_video/PURELIVE_PATCH.md):
  # 与 workspace 成员同源, 不再从 Predidit/media-kit 拉取。
  media_kit:
    path: ../media_kit

  media_kit_video:
    path: ../media_kit_video

dev_dependencies:
  flutter_lints: ^6.0.0