name: media_core_media_kit
description: media_kit backend adapter for the media_core player framework.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  # Upstream Predidit/media-kit, pinned. The repository no longer carries copies
  # of these two packages: the fork patches described in pure_live's
  # media_kit_video/PURELIVE_PATCH.md (Android Surface/vid ownership,
  # setVideoOutputEnabled, Windows frameRevision) are NOT in this revision, so
  # nothing here may depend on them.
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 803c4a27912091db6f839d48d1b984a0d9f588c7
      path: ./media_kit

  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 803c4a27912091db6f839d48d1b984a0d9f588c7
      path: ./media_kit_video

dev_dependencies:
  flutter_lints: ^6.0.0