name: media_core_media_kit
description: media_kit backend adapter for the media_core player framework.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core

  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: main
      path: media_kit          # 仓库内子目录

  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: main
      path: media_kit_video    # 仓库内子目录

  device_info_plus: ^13.2.0

# 强制所有对 media_kit 的引用都指向同一个 Git 来源
dependency_overrides:
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: main
      path: media_kit          # 关键：必须和上面的 path 一致

  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: main
      path: media_kit_video    # 建议同步覆盖，避免其他包引入冲突版本

dev_dependencies:
  flutter_lints: ^6.0.0