org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# On this workstation the Kotlin daemon cannot write its incremental caches for
# this project's build directory ("Could not close incremental caches in
# build/<plugin>/kotlin/compileDebugKotlin/cacheable/caches-jvm/..."), which
# fails :package_info_plus:compileDebugKotlin and :audio_session:compileDebugKotlin
# on every build - including after `gradlew --stop` and deleting the caches.
# Turning the incremental caches off for the example costs some Kotlin rebuild
# time and makes the build reliable; remove this once the cause is understood.
kotlin.incremental=false
