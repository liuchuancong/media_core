name: media_core_workspace
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

workspace:
  - packages/media_core
  - packages/media_core_media_kit
  - packages/media_core_better_player
  - packages/media_core_native
  - packages/media_core_ijk_player
  - packages/media_core_fvp
  - packages/media_core_audio
  - packages/media_core_presentation
  - examples/example

dependency_overrides:
  wakelock_plus: ^1.7.0
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: main
      path: media_kit

  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: main
      path: media_kit_video